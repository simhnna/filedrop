name: Release

# Push a tag like v1.2.3 to build the CLI for every platform and publish a
# GitHub release. Asset names carry no version, so
# releases/latest/download/<asset> always points at the newest build.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        id: build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GOOS=${TARGET%/*}
          GOARCH=${TARGET#*/}
          name="filedrop-$GOOS-$GOARCH"
          [ "$GOOS" = windows ] && name="$name.exe"
          GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X filedrop-cli/cmd.version=${GITHUB_REF_NAME#v}" \
            -o "../out/$name" .
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.name }}
          path: out/${{ steps.build.outputs.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum filedrop-* > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
